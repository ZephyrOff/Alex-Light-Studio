save_scene:
  name: Enregistrer une scène de dégradé
  description: >-
    Enregistre le dégradé actuellement testé comme une scène réutilisable,
    sous forme de points d'ancrage indépendants du nombre de segments —
    rejouable ensuite sur n'importe quel bandeau, quel que soit son nombre
    réel de segments.
  fields:
    name:
      name: Nom
      description: Nom de la scène (utilisé pour la charger et l'identifier plus tard).
      required: true
      example: "Coucher de soleil"
      selector:
        text:
    colors:
      name: Couleurs
      description: >-
        Liste des couleurs actuellement affichées, dans l'ordre, une par
        segment (hex, ex. #ff6b35) — supposées également espacées le long
        du bandeau d'origine.
      required: true
      example: ["#ff6b35", "#f7c548", "#ffe066", "#c04cfd", "#5e60ce"]
      selector:
        object:

load_scene:
  name: Charger une scène de dégradé
  description: >-
    Applique une scène de dégradé enregistrée sur un bandeau précis, en
    adaptant automatiquement le nombre de couleurs envoyées à son nombre
    réel de segments (par interpolation).
  fields:
    entity_id:
      name: Lumière
      description: Entité du bandeau/lampe à piloter.
      required: true
      selector:
        entity:
          domain: light
    name:
      name: Nom de la scène
      description: Nom de la scène enregistrée à charger.
      required: true
      example: "Coucher de soleil"
      selector:
        text:
    device_type:
      name: Type d'appareil
      description: Détermine le format du message envoyé à Zigbee2MQTT.
      required: true
      selector:
        select:
          options:
            - label: Philips Hue Gradient
              value: hue
            - label: Aqara LED Strip T1
              value: aqara
    friendly_name:
      name: Nom convivial Z2M
      description: >-
        Nom utilisé dans le topic MQTT, si différent du nom de l'entité HA.
        Vide = déduit du nom de l'entité.
      required: false
      selector:
        text:
    length_entity:
      name: Entité longueur du bandeau (Aqara)
      description: >-
        À renseigner uniquement si le nom ne suit pas la convention standard
        (number.<entité>_length) — sinon déduite automatiquement.
      required: false
      selector:
        entity:
          domain: number
    segments:
      name: Nombre de segments (repli)
      description: >-
        Obligatoire en pratique pour Hue (aucune détection automatique
        possible côté Z2M) ; sert de repli pour Aqara si la détection
        automatique échoue.
      required: false
      selector:
        number:
          min: 2
          max: 50
          mode: box

delete_scene:
  name: Supprimer une scène de dégradé
  description: Supprime définitivement une scène enregistrée.
  fields:
    name:
      name: Nom
      description: Nom de la scène à supprimer.
      required: true
      selector:
        text:

save_snapshot:
  name: Enregistrer un instantané de lumières
  description: >-
    Enregistre l'état actuel (allumé/éteint, luminosité, couleur) d'une liste
    de lumières, comme scene.create, mais en choisissant d'inclure ou non les
    effets en cours. Conservé après un redémarrage de Home Assistant.
  fields:
    name:
      name: Nom
      description: Nom de l'instantané (sert à le recharger ensuite).
      required: true
      example: "snaplight_1er"
      selector:
        text:
    snapshot_entities:
      name: Entités
      description: Lumières (ou autres entités on/off) à enregistrer.
      required: true
      example: "{{ label_entities('light_1er') }}"
      selector:
        entity:
          multiple: true
    include_effects:
      name: Inclure les effets
      description: >-
        Désactivé (par défaut) : l'effet en cours n'est pas enregistré, donc
        jamais relancé au rechargement.
      required: false
      default: false
      selector:
        boolean:

load_snapshot:
  name: Charger un instantané de lumières
  description: Restaure un instantané enregistré avec save_snapshot.
  fields:
    name:
      name: Nom
      description: Nom de l'instantané à charger.
      required: true
      example: "snaplight_1er"
      selector:
        text:
    transition:
      name: Transition
      description: Durée de la transition, en secondes.
      required: false
      selector:
        number:
          min: 0
          max: 300
          step: 0.5
          unit_of_measurement: s
    restore_effects:
      name: Restaurer les effets
      description: >-
        Si l'instantané contient des effets, les rejouer (défaut : oui).
        Décocher pour les ignorer à ce chargement.
      required: false
      default: true
      selector:
        boolean:

delete_snapshot:
  name: Supprimer un instantané de lumières
  description: Supprime définitivement un instantané enregistré.
  fields:
    name:
      name: Nom
      description: Nom de l'instantané à supprimer.
      required: true
      selector:
        text:
